name: Databricks Medallion Pipeline

on:
  push:
    branches:
      - main

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:

  bronze:
    runs-on: ubuntu-latest
    name: Run Bronze Layer

    steps:
      - uses: actions/checkout@v3

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Run Bronze Notebook
        run: |
          databricks jobs run-now --job-id 101

  silver:
    runs-on: ubuntu-latest
    needs: bronze
    name: Run Silver Layer

    steps:
      - uses: actions/checkout@v3

      - name: Run Silver Notebook
        run: |
          databricks jobs run-now --job-id 102

  gold:
    runs-on: ubuntu-latest
    needs: silver
    name: Run Gold Layer

    steps:
      - uses: actions/checkout@v3

      - name: Run Gold Notebook
        run: |
          databricks jobs run-now --job-id 103
